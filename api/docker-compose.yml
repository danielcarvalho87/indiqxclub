# Stack da API IndiqX Club para deploy em servidor com Docker / Swarm
#
# Uso simples (Docker Compose):
#   cp .env.example .env   # preencha as variáveis
#   docker compose up -d --build
#
# Uso em Swarm (Portainer):
#   Cadastre as variáveis em "Environment variables" no Portainer
#   e aponte para a imagem do registry (troque o build por image).
#
# As variáveis abaixo devem estar no .env ou cadastradas no Portainer.

services:
  api:
    image: ghcr.io/danielcarvalho87/indiqx-api:latest
    init: true
    ports:
      - "${PORT:-3011}:3011"
    networks:
      - network_public
    environment:
      NODE_ENV: production
      PORT: 3011
      TZ: America/Sao_Paulo

      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}

      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASS: ${DATABASE_PASS}
      DATABASE_DB: ${DATABASE_DB}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
    volumes:
      - indiqx_uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 512M

volumes:
  indiqx_uploads:
    external: false

networks:
  network_public:
    external: true
    name: network_public
